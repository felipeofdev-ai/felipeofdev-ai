<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Felipe Oliveira Fernandes  16-bit developer platformer hero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec5ff"/>
      <stop offset="55%" stop-color="#4a9fd4"/>
      <stop offset="100%" stop-color="#2d6a8f"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d7a52"/>
      <stop offset="100%" stop-color="#2f6240"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf6a"/>
      <stop offset="100%" stop-color="#35804f"/>
    </linearGradient>
    <pattern id="brick" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#8b4513"/>
      <rect width="7" height="3" fill="#a0522d"/>
      <rect x="8" width="8" height="3" fill="#a0522d"/>
      <rect y="4" width="8" height="3" fill="#a0522d"/>
      <rect x="9" y="4" width="7" height="3" fill="#a0522d"/>
    </pattern>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000"/>
    </filter>
    <style><![CDATA[
      .blink { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type-cursor { animation: cursor 0.8s step-end infinite; }
      @keyframes cursor { 50% { opacity: 0; } }
    ]]></style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- Drifting clouds -->
  <g opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="820 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="90" cy="52" rx="34" ry="16" fill="#fff"/>
      <ellipse cx="118" cy="48" rx="26" ry="14" fill="#fff"/>
      <ellipse cx="64" cy="50" rx="20" ry="12" fill="#fff"/>
      <ellipse cx="420" cy="38" rx="40" ry="18" fill="#fff"/>
      <ellipse cx="452" cy="34" rx="28" ry="15" fill="#fff"/>
      <ellipse cx="388" cy="36" rx="22" ry="13" fill="#fff"/>
    </g>
  </g>

  <!-- Hills -->
  <ellipse cx="180" cy="210" rx="220" ry="55" fill="url(#hillFar)" opacity="0.85"/>
  <ellipse cx="620" cy="218" rx="260" ry="62" fill="url(#hillFar)" opacity="0.75"/>
  <ellipse cx="400" cy="232" rx="480" ry="70" fill="url(#hillNear)"/>

  <!-- Goal flag (original) -->
  <g transform="translate(740, 148)">
    <rect x="0" y="0" width="4" height="82" fill="#c4a35a"/>
    <polygon points="4,8 38,18 4,28" fill="#ffd700"/>
    <rect x="4" y="8" width="34" height="20" fill="#ff6b6b" opacity="0.9"/>
    <circle cx="2" cy="4" r="5" fill="#ffd700"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="248" width="800" height="52" fill="url(#brick)"/>
  <rect x="0" y="240" width="800" height="12" fill="#3cb371"/>
  <rect x="0" y="240" width="800" height="4" fill="#5fd38a"/>

  <!-- Tech blocks (original floating crates, not ? blocks) -->
  <g id="blocks">
    <!-- TS block -->
    <g id="block-ts">
      <rect x="148" y="118" width="44" height="44" fill="#3178c6" stroke="#1e4f8a" stroke-width="3"/>
      <rect x="152" y="122" width="36" height="8" fill="#5ba0e8" opacity="0.6"/>
      <text x="170" y="148" font-family="monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">TS</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0; 0.12; 0.22" dur="3s" begin="2.85s" repeatCount="indefinite"/>
    </g>
    <!-- Python block -->
    <g id="block-py">
      <rect x="248" y="108" width="44" height="44" fill="#3776ab" stroke="#1f4f73" stroke-width="3"/>
      <rect x="252" y="112" width="36" height="8" fill="#5a9fd4" opacity="0.6"/>
      <text x="270" y="138" font-family="monospace" font-size="14" font-weight="bold" fill="#ffd43b" text-anchor="middle">Py</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" keyTimes="0; 0.12; 0.22" dur="3s" begin="2.95s" repeatCount="indefinite"/>
    </g>
    <!-- Docker block -->
    <g id="block-docker">
      <rect x="348" y="118" width="44" height="44" fill="#2496ed" stroke="#1256a3" stroke-width="3"/>
      <rect x="352" y="122" width="36" height="8" fill="#6bb8ff" opacity="0.6"/>
      <text x="370" y="146" font-family="monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">=3</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0; 0.12; 0.22" dur="3s" begin="3.05s" repeatCount="indefinite"/>
    </g>
    <!-- Postgres block -->
    <g id="block-pg">
      <rect x="448" y="108" width="44" height="44" fill="#336791" stroke="#1a3d57" stroke-width="3"/>
      <rect x="452" y="112" width="36" height="8" fill="#5a8fb8" opacity="0.6"/>
      <text x="470" y="138" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">PG</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" keyTimes="0; 0.12; 0.22" dur="3s" begin="3.15s" repeatCount="indefinite"/>
    </g>
    <!-- Clojure block -->
    <g id="block-clj">
      <rect x="548" y="118" width="44" height="44" fill="#5881d8" stroke="#334f8a" stroke-width="3"/>
      <rect x="552" y="122" width="36" height="8" fill="#8aa8ef" opacity="0.6"/>
      <text x="570" y="146" font-family="monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ù</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0; 0.12; 0.22" dur="3s" begin="3.25s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Code gem particles (on block hit) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.88;0.9;0.96;1" dur="3s" repeatCount="indefinite"/>
    <polygon points="170,90 174,98 182,98 176,104 178,112 170,108 162,112 164,104 158,98 166,98" fill="#ffd700">
      <animateTransform attributeName="transform" type="translate" values="0,20; 0,-30" dur="0.5s" begin="2.9s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="270,80 273,86 279,86 275,90 277,96 270,93 263,96 265,90 261,86 267,86" fill="#00ffcc">
      <animateTransform attributeName="transform" type="translate" values="0,18; 0,-28" dur="0.55s" begin="3s" repeatCount="indefinite"/>
    </polygon>
    <rect x="366" y="92" width="8" height="8" fill="#ff6b6b" transform="rotate(45 370 96)">
      <animateTransform attributeName="transform" type="translate" values="0,16; 0,-24" dur="0.45s" begin="3.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="470" cy="88" r="4" fill="#ffd700">
      <animate attributeName="cy" values="108;68" dur="0.5s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="570,92 573,98 579,98 575,102 577,108 570,105 563,108 565,102 561,98 567,98" fill="#c084fc">
      <animateTransform attributeName="transform" type="translate" values="0,18; 0,-26" dur="0.48s" begin="3.3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bug enemies (original critters) -->
  <g id="bug1">
    <ellipse cx="210" cy="252" rx="14" ry="10" fill="#7c3aed"/>
    <rect x="198" y="246" width="6" height="6" fill="#fff"/>
    <rect x="216" y="246" width="6" height="6" fill="#fff"/>
    <rect x="200" y="248" width="3" height="3" fill="#111"/>
    <rect x="218" y="248" width="3" height="3" fill="#111"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,0; 0,0; 50,0; 0,0" dur="8s" repeatCount="indefinite"/>
  </g>
  <g id="bug2">
    <ellipse cx="520" cy="254" rx="12" ry="9" fill="#ef4444"/>
    <rect x="510" y="249" width="5" height="5" fill="#fff"/>
    <rect x="525" y="249" width="5" height="5" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 35,0; -25,0; 0,0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Pixel developer sprite (Option A  tune colors for Felipe) -->
  <!-- skin:#d4a574 hair:#2c1810 shirt:#2563eb pants:#1e293b shoes:#111 -->
  <g id="hero">
    <animateTransform attributeName="transform" type="translate"
      values="80,0; 80,0; 80,-52; 80,-52; 80,0; 80,0; 80,0; 80,0; 80,0; 80,0"
      keyTimes="0; 0.08; 0.18; 0.28; 0.38; 0.55; 0.7; 0.82; 0.92; 1"
      dur="3s" repeatCount="indefinite"/>
    <!-- shadow -->
    <ellipse cx="118" cy="246" rx="18" ry="5" fill="#000" opacity="0.25">
      <animate attributeName="rx" values="18;12;18;18;18" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <!-- photo-derived pixel avatar: assets/pixel-avatar/idle.png -->
    <image href="pixel-avatar/idle.png" x="98" y="208" width="40" height="40" image-rendering="pixelated"/>
    <rect x="134" y="218" width="14" height="10" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <rect x="136" y="220" width="10" height="6" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- Title overlay -->
  <rect x="0" y="0" width="800" height="72" fill="#0d1117" opacity="0.55"/>
  <text x="400" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffd700" text-anchor="middle" filter="url(#textShadow)">
    FELIPE OLIVEIRA FERNANDES
    <animate attributeName="opacity" values="1;1;0.3;1" dur="0.1s" begin="0s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <text x="400" y="56" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" text-anchor="middle" opacity="0.95">
    Backend Developer ù Sùo Josù dos Campos, BR
  </text>

  <!-- PRESS START -->
  <text x="400" y="288" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffd700" text-anchor="middle" filter="url(#textShadow)" class="blink">
    ù PRESS START TO CONTINUE
  </text>
</svg>
