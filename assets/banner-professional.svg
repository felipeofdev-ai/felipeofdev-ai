<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.55"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="400" fill="url(#accent)"/>

  <!-- Subtle graph edges (agent systems motif) -->
  <g opacity="0.18" stroke="#22D3EE" stroke-width="1.5" fill="none">
    <circle cx="980" cy="90" r="5" fill="#22D3EE" stroke="none"/>
    <circle cx="1080" cy="140" r="5" fill="#22D3EE" stroke="none"/>
    <circle cx="1040" cy="240" r="5" fill="#22D3EE" stroke="none"/>
    <circle cx="920" cy="200" r="5" fill="#22D3EE" stroke="none"/>
    <circle cx="1120" cy="280" r="5" fill="#22D3EE" stroke="none"/>
    <line x1="980" y1="90" x2="1080" y2="140"/>
    <line x1="1080" y1="140" x2="1040" y2="240"/>
    <line x1="980" y1="90" x2="920" y2="200"/>
    <line x1="920" y1="200" x2="1040" y2="240"/>
    <line x1="1040" y1="240" x2="1120" y2="280"/>
  </g>

  <!-- Code bracket motif -->
  <text x="880" y="320" font-family="'Consolas','Courier New',monospace" font-size="120" fill="#21262D" opacity="0.35">{</text>
  <text x="1080" y="320" font-family="'Consolas','Courier New',monospace" font-size="120" fill="#21262D" opacity="0.35">}</text>

  <!-- API/schema lines (right side) -->
  <g opacity="0.22" font-family="'Consolas','Courier New',monospace" font-size="11" fill="#58A6FF">
    <text x="860" y="60">GET /api/v1/agents</text>
    <text x="860" y="78">POST /events · signed</text>
    <text x="860" y="96">schema: z.object({...})</text>
    <text x="860" y="114">checkpoint: postgres</text>
  </g>

  <!-- Shield outline (security motif) -->
  <path d="M1140 310 L1140 270 Q1140 250 1120 242 L1100 234 Q1080 226 1080 246 L1080 310 Q1080 330 1100 338 L1120 346 Q1140 354 1140 334 Z"
        stroke="#30363D" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Terminal window frame (subtle) -->
  <rect x="48" y="48" width="1104" height="304" rx="6" stroke="#30363D" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="68" cy="68" r="5" fill="#484F58"/>
  <circle cx="86" cy="68" r="5" fill="#484F58"/>
  <circle cx="104" cy="68" r="5" fill="#484F58"/>
  <line x1="48" y1="88" x2="1152" y2="88" stroke="#30363D" stroke-width="1" opacity="0.6"/>

  <!-- Prompt line -->
  <text x="72" y="118" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#484F58">~/backend · agent-systems</text>
  <text x="72" y="142" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#22D3EE">$</text>
  <text x="88" y="142" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#8B949E"> whoami --engineer</text>

  <!-- Name -->
  <text x="72" y="210" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">
    Felipe Oliveira Fernandes
  </text>

  <!-- Title -->
  <text x="72" y="252" font-family="'Consolas','Courier New',monospace" font-size="18" fill="#22D3EE">
    Backend / Agent Systems Engineer
  </text>

  <!-- Location + stack signal -->
  <text x="72" y="286" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#8B949E">
    São José dos Campos, BR · TypeScript · PostgreSQL · LangGraph · OSS
  </text>

  <!-- Bottom accent line -->
  <rect x="72" y="310" width="280" height="2" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Stack pills -->
  <g font-family="'Consolas','Courier New',monospace" font-size="11">
    <rect x="72" y="330" width="72" height="24" rx="4" fill="#21262D" stroke="#30363D"/>
    <text x="84" y="346" fill="#58A6FF">Node.js</text>
    <rect x="152" y="330" width="48" height="24" rx="4" fill="#21262D" stroke="#30363D"/>
    <text x="164" y="346" fill="#22D3EE">APIs</text>
    <rect x="208" y="330" width="72" height="24" rx="4" fill="#21262D" stroke="#30363D"/>
    <text x="220" y="346" fill="#3FB950">Postgres</text>
    <rect x="288" y="330" width="80" height="24" rx="4" fill="#21262D" stroke="#30363D"/>
    <text x="300" y="346" fill="#A371F7">LangGraph</text>
    <rect x="376" y="330" width="56" height="24" rx="4" fill="#21262D" stroke="#30363D"/>
    <text x="388" y="346" fill="#F0883E">Zod</text>
  </g>
</svg>
