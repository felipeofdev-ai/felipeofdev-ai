name: SNES Boss Battle

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: boss-battle-${{ github.event.issue.number || 'global' }}
  cancel-in-progress: false

jobs:
  battle:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'boss-battle')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'boss-battle') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run battle engine
        id: engine
        run: node scripts/boss-battle.mjs > battle-output.json || true
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Post battle comment
        if: steps.engine.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('battle-output.json')) return;
            const raw = fs.readFileSync('battle-output.json', 'utf8').trim();
            if (!raw) return;
            let payload;
            try { payload = JSON.parse(raw); } catch { return; }
            if (!payload.comment) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: payload.comment
            });

      - name: Commit README + scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/boss-high-scores.json .github/boss-state/ || true
          git diff --staged --quiet || git commit -m "chore(boss-battle): update arena scores [skip ci]"
          git push
