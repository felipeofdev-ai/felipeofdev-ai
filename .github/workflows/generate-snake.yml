name: Generate contribution snake

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: felipeofdev-ai
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
          snake_color: '00FF00'
          dot_color: '0D1117'

      - name: Publish snake to profile dist
        run: |
          mkdir -p dist
          cp dist/github-contribution-grid-snake-dark.svg dist/github-contribution-grid-snake.svg 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
